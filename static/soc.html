<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOC Console — Agentic Honey-Pot</title>
  <style>
    :root {
      color-scheme: dark;
      --plane: #0d0d0d;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --surface-3: #2c2c2a;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.18);
      --accent: #3987e5;
      --good: #199e70;
      --warning: #fab219;
      --serious: #ec835a;
      --critical: #d03b3b;
      --radius: 12px;
      --radius-sm: 7px;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--plane); color: var(--text-primary);
      font-family: var(--sans); font-size: 14px; line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    .wrap { max-width: 1360px; margin: 0 auto; padding: 20px 22px 60px; }

    header.top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--good);
      box-shadow: 0 0 0 4px rgba(25,158,112,.18); }
    .brand h1 { font-size: 19px; margin: 0; letter-spacing: .2px; }
    .brand .sub { color: var(--text-muted); font-size: 12.5px; }
    .navlinks { display: flex; gap: 6px; flex-wrap: wrap; }
    .navlinks a { font-size: 12.5px; padding: 6px 11px; border: 1px solid var(--border);
      border-radius: 999px; color: var(--text-secondary); }
    .navlinks a:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .navlinks a.active { background: var(--surface-2); color: var(--text-primary); border-color: var(--border-strong); }
    .refresh { color: var(--text-muted); font-size: 12px; font-family: var(--mono); }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 15px; }
    .kpi .label { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase;
      letter-spacing: .6px; margin-bottom: 6px; }
    .kpi .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .kpi .value small { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
    .kpi .hint { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; }
    .kpi.accent .value { color: var(--accent); }
    .kpi.good .value { color: var(--good); }
    .kpi.warn .value { color: var(--warning); }
    .kpi.crit .value { color: var(--critical); }

    .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; align-items: start; }
    @media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }

    .panel { background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; }
    .panel > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .7px;
      color: var(--text-secondary); margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; }
    .panel > h2 .count { color: var(--text-muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr.selected { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
    td.mono, .mono { font-family: var(--mono); font-size: 12px; }

    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
      font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
    .sev-CRITICAL { background: rgba(208,59,59,.16); color: #ff8a8a; }
    .sev-HIGH { background: rgba(236,131,90,.16); color: #ffb08a; }
    .sev-MEDIUM { background: rgba(250,178,25,.15); color: #ffd479; }
    .sev-LOW { background: rgba(137,135,129,.18); color: var(--text-secondary); }
    .band-CRITICAL, .band-HIGH { background: rgba(208,59,59,.14); color: #ff9a9a; }
    .band-MEDIUM { background: rgba(250,178,25,.14); color: #ffd479; }
    .band-LOW { background: rgba(137,135,129,.16); color: var(--text-secondary); }
    .verdict-TRUE_POSITIVE { background: rgba(208,59,59,.16); color: #ff8a8a; }
    .verdict-LIKELY_THREAT { background: rgba(236,131,90,.16); color: #ffb08a; }
    .verdict-INCONCLUSIVE { background: rgba(250,178,25,.14); color: #ffd479; }
    .verdict-LIKELY_BENIGN { background: rgba(25,158,112,.16); color: #6fdcb2; }
    .src-Mixed { background: rgba(57,135,229,.16); color: #8fbdf5; }
    .src-Technical { background: rgba(137,135,129,.16); color: var(--text-secondary); }
    .src-Honeypot { background: rgba(25,158,112,.14); color: #6fdcb2; }
    .status-ACTION_REQUIRED { color: #ff8a8a; }
    .status-INVESTIGATING { color: #ffd479; }
    .status-CONTAINED { color: #6fdcb2; }
    .status-NEW { color: var(--text-secondary); }

    .entity { padding: 11px 15px; border-bottom: 1px solid var(--border); }
    .entity:last-child { border-bottom: 0; }
    .entity .row1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .entity .ename { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
    .entity .sig { color: var(--text-muted); font-size: 11.5px; margin-top: 3px; }
    .bar { height: 5px; border-radius: 3px; background: var(--surface-3); margin-top: 7px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--accent); }

    .enrichbox { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .enrichbox select, .enrichbox input {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary);
      border-radius: var(--radius-sm); padding: 7px 10px; font-size: 13px; font-family: var(--sans); }
    .enrichbox input { flex: 1; min-width: 140px; font-family: var(--mono); font-size: 12px; }
    .enrichbox button, .btn {
      background: var(--accent); color: #fff; border: 0; border-radius: var(--radius-sm);
      padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .enrichbox button:hover, .btn:hover { filter: brightness(1.08); }
    .enrich-result { padding: 0 16px 12px; font-size: 12.5px; color: var(--text-secondary); }

    /* case drawer */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 40; }
    .drawer-overlay.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(620px, 94vw);
      background: var(--surface-1); border-left: 1px solid var(--border-strong); z-index: 50;
      transform: translateX(100%); transition: transform .18s ease; overflow-y: auto; }
    .drawer.open { transform: translateX(0); }
    .drawer .dhead { position: sticky; top: 0; background: var(--surface-1); padding: 16px 18px;
      border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .drawer .dhead h3 { margin: 0 0 6px; font-size: 16px; }
    .drawer .close { background: none; border: 1px solid var(--border); color: var(--text-secondary);
      border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font-size: 16px; line-height: 1; }
    .drawer .body { padding: 16px 18px; }
    .sec { margin-bottom: 20px; }
    .sec h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted);
      margin: 0 0 9px; }
    .narrative { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 13px; font-size: 13px; color: var(--text-secondary); }
    .tl { list-style: none; margin: 0; padding: 0; }
    .tl li { position: relative; padding: 0 0 12px 18px; border-left: 2px solid var(--surface-3); }
    .tl li:last-child { border-left-color: transparent; }
    .tl li::before { content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--accent); }
    .tl .t { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12.5px; }
    .kv dt { color: var(--text-muted); }
    .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
    ul.steps, ul.plain { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-secondary); }
    ul.steps li, ul.plain li { margin-bottom: 6px; }
    .enr { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 8px; }
    .enr .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .enr .ev { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .enr .reasons { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; }
    .action-row { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .action-row:last-child { border-bottom: 0; }
    .action-row .p { font-family: var(--mono); color: var(--text-muted); font-size: 11px; }
    .action-row .a { font-weight: 600; }
    .action-row .meta { color: var(--text-muted); font-size: 11.5px; }
    .empty { padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }
    .loading { color: var(--text-muted); font-size: 12px; padding: 20px 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>SOC Console</h1>
          <div class="sub">Behavioural analytics &middot; automated investigation &middot; response</div>
        </div>
      </div>
      <nav class="navlinks">
        <a href="/soc" class="active">SOC</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/console">Console</a>
        <span class="refresh" id="refreshNote">—</span>
      </nav>
    </header>

    <section class="kpis" id="kpis"><div class="loading">Loading SOC posture…</div></section>

    <div class="grid2">
      <div class="panel">
        <h2>Case queue <span class="count" id="caseCount"></span></h2>
        <div id="casesWrap"><div class="loading">Loading cases…</div></div>
      </div>

      <div class="panel">
        <h2>Risky entities · UEBA <span class="count" id="entCount"></span></h2>
        <div id="entitiesWrap"><div class="loading">Loading entities…</div></div>
        <div class="enrichbox">
          <select id="enrichKind">
            <option value="domain">domain</option>
            <option value="ip">ip</option>
            <option value="email">email</option>
            <option value="upi">upi</option>
          </select>
          <input id="enrichValue" placeholder="enrich an indicator, e.g. sbi-verify.tk" />
          <button id="enrichBtn">Enrich</button>
        </div>
        <div class="enrich-result" id="enrichResult"></div>
      </div>
    </div>
  </div>

  <div class="drawer-overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="dhead">
      <div>
        <h3 id="dTitle">Case</h3>
        <div id="dTags"></div>
      </div>
      <button class="close" id="dClose" aria-label="Close">&times;</button>
    </div>
    <div class="body" id="dBody"><div class="loading">Loading case…</div></div>
  </aside>

  <script src="/static/soc.js"></script>
</body>
</html>
